# An Alpine Linux image for vemu: `vemu build examples/alpine.conf`.
#
# Syntax: `key = value` lines, `[section]` headers, and comment lines that
# start with `#` (a `#` later in a line is part of the value). Quote a
# value that has spaces: "my key.pub". Relative host paths are relative to
# this file's directory; `~/` is $HOME. Unknown keys, repeated keys and bad
# values are errors that name file:line. docs/image-builder.md is the full
# reference.
#
# The image is a raw ext4 filesystem with no partition table (/dev/vda),
# labelled vemu-root. Boot it with the kernel it was built with:
#   vemu overlay create alpine.raw vm1.vov
#   vemu --kernel testdata/Image --disk vm1.vov --append "root=/dev/vda rw" -p 2222:22
#   ssh -p 2222 root@127.0.0.1

# The architecture: the host's (vemu does not emulate CPUs). aarch64 on a
# Mac with Apple silicon; x86_64 or aarch64 on Linux with KVM.
#arch = aarch64

# Virtual size of the image (sparse: only what is written takes disk space).
# K, M, G or T; from 128M to 2T.
size = 1G

# The Alpine release: latest-stable, a branch (v3.24), or an exact version
# (3.24.4). The minirootfs is downloaded over https and checked against the
# sha256 the release index publishes; pin it to refuse anything else:
alpine = latest-stable
#sha256 = 4b14c18f7e90a063b61462ea1462a5732c154bf6adad594974fe6487cd98a8de

# The package mirror (https; an http:// mirror also needs insecure = true,
# and should come with a sha256 pin).
#mirror = https://dl-cdn.alpinelinux.org/alpine
#insecure = false

# Also enable the community repository (main is always on).
#community = false

# The kernel the builder VM boots, and the kernel to boot the image with.
# Overridden by --kernel. It needs virtio-blk, virtio-net, ext4 and a
# console on hvc0 (testdata/Image and testdata/x86_64/bzImage qualify).
kernel = ../testdata/Image

# Optional: its modules, as a tarball with lib/modules/<version>/ inside;
# they are installed in the image and depmod is run (modprobe then works).
#modules = ~/kernels/modules.tar.gz

hostname = alpine
timezone = UTC

# Where to write the image (default: alpine.raw next to this file; -o
# overrides it).
#output = alpine.raw

[network]
# eth0 by DHCP at boot (vemu's user-mode network gives 10.0.2.15 and a DNS
# server). Off: only lo is configured.
dhcp = true
# chronyd keeps the clock synced to pool.ntp.org. The clock is already right
# at boot without it: an aarch64 guest reads vemu's PL031 RTC (hwclock), an
# x86_64 guest the host's time from kvmclock.
ntp = true

[ssh]
# An ssh server for root, with public keys only (no password logins).
# Without it, log in as root on the console (no password).
enable = true
# openssh (default) or dropbear.
server = openssh
# Public key files for /root/.ssh/authorized_keys (several are allowed).
authorized_keys = ~/.ssh/id_ed25519.pub

[packages]
# Extra apk packages, on one or several list lines.
list = curl ca-certificates
#list = htop tmux

[files]
# Host files copied into the image: /path/in/image = host/path [mode].
# The mode defaults to the host file's; owner root. A host directory is
# copied recursively (regular files and directories only).
#/etc/motd = motd
#/usr/local/bin/hello = hello.sh 0755
#/etc/myapp = myapp-config/

[run]
# A script run last, in the image (chroot) as root, with the network up:
# for anything the keys above do not cover. A #! line picks the
# interpreter; otherwise it runs with /bin/sh. A non-zero exit fails the
# build.
#script = setup.sh
